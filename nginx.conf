events {}

http {
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    map $sent_http_content_type $cache_control {
        default "";
        ~*text/html "no-cache, must-revalidate";
        ~*text/css "public, max-age=31536000, immutable";
        ~*application/javascript "public, max-age=31536000, immutable";
        ~*application/json "public, max-age=31536000, immutable";
        ~*image/png "public, max-age=31536000, immutable";
        ~*image/jpeg "public, max-age=31536000, immutable";
        ~*font/woff2 "public, max-age=31536000, immutable";
        ~*video/mp4 "public, max-age=31536000, immutable";
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self';" always;

        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        error_page 404 /404.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /404.html {
            internal;
        }

        location ~ /\. {
            return 404;
        }

        location ~* \.(env|git|yml|yaml|config)$ {
            return 404;
        }
    }
}
